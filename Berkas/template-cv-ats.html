<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template CV ATS</title>
</head>
<body>

<header>
  <a href="index.html">&larr; Kembali</a>
  <h1>Template CV ATS</h1>
</header>

<main>

  <!-- Filter & Search -->
  <section aria-label="Filter dan pencarian">
    <details>
      <summary>Rumpun Karir &#9662;</summary>
      <fieldset>
        <legend>Pilih rumpun karir</legend>
        <label><input type="checkbox" name="rumpun" value="it"> IT</label><br>
        <label><input type="checkbox" name="rumpun" value="pemasaran"> Pemasaran</label><br>
        <label><input type="checkbox" name="rumpun" value="keuangan"> Keuangan</label><br>
        <label><input type="checkbox" name="rumpun" value="hukum"> Hukum</label><br>
        <label><input type="checkbox" name="rumpun" value="teknik"> Teknik</label><br>
        <label><input type="checkbox" name="rumpun" value="desain"> Desain</label><br>
        <label><input type="checkbox" name="rumpun" value="pendidikan"> Pendidikan</label><br>
        <label><input type="checkbox" name="rumpun" value="kesehatan"> Kesehatan</label>
      </fieldset>
    </details>

    <p>
      <label for="cari">Cari Template</label>
      <input type="search" id="cari" name="cari" placeholder="Cari Template..">
    </p>
  </section>

  <hr>

  <!-- Katalog Template -->
  <section aria-label="Katalog template">
    <table border="1" cellpadding="12">
      <tr>
        <td>
          <article>
            <figure>
              <pre>

   [ Pratinjau
     Template ]

              </pre>
            </figure>
            <h2>Template Modern</h2>
            <p>Cocok untuk: Pemasaran</p>
            <button type="button">Pratinjau</button>
            <button type="button">Unduh (.DOCX)</button>
          </article>
        </td>

        <td>
          <article>
            <figure>
              <pre>

   [ Pratinjau
     Template ]

              </pre>
            </figure>
            <h2>Template Klasik</h2>
            <p>Cocok untuk: Keuangan</p>
            <button type="button">Pratinjau</button>
            <button type="button">Unduh (.DOCX)</button>
          </article>
        </td>

        <td>
          <article>
            <figure>
              <pre>

   [ Pratinjau
     Template ]

              </pre>
            </figure>
            <h2>Template Teknis</h2>
            <p>Cocok untuk: IT</p>
            <button type="button">Pratinjau</button>
            <button type="button">Unduh (.DOCX)</button>
          </article>
        </td>
      </tr>
    </table>
  </section>

  <p>Menampilkan 3 dari 24 template &mdash; scroll untuk melihat lebih banyak</p>

</main>

</body>
</html>
