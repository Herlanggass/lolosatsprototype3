<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device=width, initial-scale=1.0">
        <title>Login</title>
    </head>
<body>

    <header>
        <nav aria-label="Navigasi halaman">
           <a href="index.html">&larr; Kembali</a>
        </nav>
        <h1> Hallo, Selamat Datang</h1>
    </header>

    <main>
        <figure>
            <img src="assets/images/robot.png" alt="Ilustrasi robot AI">
        </figure>

        <section aria-labelledby="judul-login">
            <header>
                <h2 id="judul-login"> Login</h2>
                <p> Masuk ke akun Anda</p>
            </header>

            <form action="#" method="post">
                
                <p>
                    <label for="login-email">Email</label>
                    <img src="assets/images/email-icon1.png" alt="" width="16" height="16">
                    <input type="email" id="login-email" name="email" placeholder="Masukan Email" autocomplete="email" required>
                </p>
                 
                <p>
                    <label for="login-password">Password</label>
                    <img src="assets/images/lock.png" alt="" width="16" height="16">
                    <input type="password" id="login-password" name="password" placeholder="Masukan Password" autocomplete="current-password" required>
                    <button type="button" aria-controls="login-password" aria-label="Tampilkan Password">Tampilkan</button>
                    <img src="assets/images/eye-icon.png" alt="Tampilkan password" width="16" height="16">
                </p>
                
                <p>
                    <input type="checkbox" id="login-ingat" name="ingat">
                    <label for="login-ingat">Lupakan Saya</label>
                </p>
                
                <p>
                    <a href="utama.html">Masuk</a>
                </p>

            </form>

            <p>
                <button type="button">
                     <img src="assets/images/google.png" alt="" width="20" height="20">
                    Daftar dengan Google
                </button>
            </p>

            <footer>
                <p>Belum punya akun? <a href="daftar.html"> Daftar di sini</a></p>
            </footer>
        </section>

    </main>

</body>
</html>
