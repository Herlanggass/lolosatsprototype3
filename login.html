<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#081225',
                            blue: '#1B3168',
                            light: '#F3F4F6'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        @media (min-width: 1024px) {
            .curved-clip {
                clip-path: ellipse(85% 120% at 85% 50%);
            }
        }
    </style>
</head>
<body class="bg-white min-h-screen overflow-x-hidden">

    <a href="index.html" class="absolute top-6 left-8 z-20 text-slate-800 hover:text-blue-900 transition-colors p-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
        </svg>
    </a>

    <main class="min-h-screen grid grid-cols-1 lg:grid-cols-12 w-full relative">
        
        <div class="lg:col-span-5 flex flex-col justify-center items-center px-8 py-12 lg:py-0 z-10">
            <div class="max-w-md w-full text-center flex flex-col items-center">
                <h1 class="text-2xl sm:text-3xl font-bold text-brand-blue mb-8 lg:mb-12">
                    Hallo, Selamat Datang
                </h1>
                <img src="assets/images/robot.png" alt="Robot AI" class="w-64 sm:w-80 md:w-96 max-w-full h-auto object-contain hover:scale-105 transition-transform duration-300">
            </div>
        </div>

        <div class="lg:col-span-7 bg-brand-blue curved-clip flex items-center justify-center px-6 sm:px-12 py-16 lg:py-0 min-h-[600px] lg:min-h-screen">
            <div class="w-full max-w-md text-white z-10 lg:pl-12">
                
                <div class="mb-8">
                    <h2 class="text-3xl font-bold mb-1">Login</h2>
                    <p class="text-slate-200 text-sm">Masuk ke akun anda</p>
                </div>

                <form action="#" method="post" class="space-y-4">
                    
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400 pointer-events-none">
                            <img src="assets/images/email-icon1.png" alt="Email Icon" width="18" height="18" class="opacity-70">
                        </span>
                        <input type="email" id="login-email" name="email" placeholder="Masukan Email" autocomplete="email" required class="w-full pl-12 pr-4 py-3.5 bg-white rounded-lg text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
                    </div>
                     
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-slate-400 pointer-events-none">
                            <img src="assets/images/lock.png" alt="Lock Icon" width="22" height="18" class="opacity-70">
                        </span>
                        <input type="password" id="login-password" name="password" placeholder="Masukan Password" autocomplete="current-password" required class="w-full pl-12 pr-12 py-3.5 bg-white rounded-lg text-slate-800 placeholder-slate-400 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm">
                        <button type="button" id="toggle-btn" class="absolute right-4 text-slate-700 hover:text-black focus:outline-none">
                            <img id="eye-icon" src="assets/images/eye-closed.png" alt="Toggle Password" width="20" height="18" class="opacity-80">
                        </button>
                    </div>
                    
                    <div class="flex items-center pt-1">
                        <input type="checkbox" id="login-ingat" name="ingat" class="w-4 h-4 rounded border-white/40 bg-transparent text-blue-600 focus:ring-0 cursor-pointer">
                        <label for="login-ingat" class="ml-2 text-xs text-slate-200 cursor-pointer select-none">Lupakan Saya</label>
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" class="block cursor-pointer w-full text-center py-3.5 px-4 bg-brand-dark hover:opacity-90 text-white font-semibold text-sm rounded-lg transition-colors shadow-md">
                            Masuk
                        </button>
                    </div>

                </form>

                <div class="mt-3">
                    <button type="button" class="w-full flex items-center justify-center gap-2 py-3.5 px-4 bg-transparent border border-white/70 hover:bg-white/10 text-white font-medium text-sm rounded-lg transition-colors">
                        <img src="assets/images/google.png" alt="Google" width="18" height="18">
                        Login dengan Google
                    </button>
                </div>

                <p class="mt-6 text-center text-xs text-slate-200">
                    Belum punya akun? <a href="daftar.html" class="font-semibold text-white hover:underline ml-1">Daftar di sini</a>
                </p>

            </div>
        </div>

    </main>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/login-daftar.js"></script>
    <script src="js/auth-validation.js"></script>
</body>
</html>
