<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading</title>
    <link rel="stylesheet" href="style.css">
    <!-- OPTIONAL: goes to the results page by itself after 5 seconds.
         Delete this line if you don't want it. -->
    <meta http-equiv="refresh" content="5;url=uiux.html">
</head>
<body class="loading-page">

    <main>
        <section>
            <h1>Loading</h1>
            <!-- Change value="60" to change the progress (0 to 100) -->
            <progress value="60" max="100" aria-label="Loading progress">60%</progress>
        </section>
    </main>

</body>
</html>
