<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Analysis Results</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0B1120',
                            card: '#182238',
                            cardInner: '#1E293B',
                            accent: '#2563EB',
                            text: '#F8FAFC',
                            muted: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-bg text-brand-text min-h-screen font-sans antialiased selection:bg-brand-accent selection:text-white">

    <!-- Header Navigation -->
    <header class="max-w-4xl mx-auto px-4 pt-8 pb-4">
        <nav class="mb-4">
            <a href="uploadcv.html" class="inline-flex items-center text-sm font-medium text-brand-muted hover:text-white transition-colors duration-200 group">
                <span class="transform group-hover:-translate-x-1 transition-transform duration-200 mr-2">&larr;</span> Kembali
            </a>
        </nav>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">CV Analysis Results</h1>
    </header>

    <main class="max-w-4xl mx-auto px-4 pb-16 space-y-8">

        <!-- Overall Score Section -->
        <section class="bg-brand-card border border-slate-700/60 rounded-2xl p-6 text-center shadow-xl">
            <h2 class="text-xl font-semibold text-slate-300 mb-4">Overall Score</h2>
            <div class="flex flex-col items-center justify-center gap-3">
                <div class="w-full max-w-md bg-slate-800 rounded-full h-4 overflow-hidden p-0.5 border border-slate-700">
                    <div id="score-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 0%;"></div>
                </div>
                <span id="score-text" class="text-3xl font-bold text-emerald-400">0%</span>
            </div>
        </section>

            <!-- Data Pribadi Section -->
        <section>
            <div class="bg-brand-card border border-slate-700/60 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700/60 pb-2">Data Pribadi</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-brand-muted">
                    <p><strong class="text-slate-200">Nama:</strong> <span id="cv-name">-</span></p>
                    <p><strong class="text-slate-200">Posisi:</strong> <span id="cv-position">-</span></p>
                    <p><strong class="text-slate-200">Email:</strong> <span id="cv-email">-</span></p>
                    <p><strong class="text-slate-200">Pengalaman:</strong> <span id="cv-experience">-</span></p>
                    <p class="md:col-span-2"><strong class="text-slate-200">Skills:</strong> <span id="cv-skills">-</span></p>
                </div>
            </div>
        </section>

        <!-- Ringkasan Evaluasi AI -->
        <section class="mt-6">
            <div class="bg-brand-card border border-slate-700/60 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold text-white mb-2 border-b border-slate-700/60 pb-2">Ringkasan Evaluasi AI</h2>
                <p id="ai-summary" class="text-brand-muted leading-relaxed">Menunggu hasil analisis...</p>
            </div>
        </section>

        <section>
            <div class="bg-brand-card border border-slate-700/60 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-xl font-bold text-white border-b border-slate-700/60 pb-2">Saran Perbaikan & Keyword</h2>
                <ul id="ai-recommendations" class="list-disc list-inside text-brand-muted space-y-2">
                    <li>Belum ada data analisis.</li>
                </ul>
            </div>
        </section>


        <!-- Image & Actions -->
        <div class="flex flex-col items-center gap-6 pt-4">
            <img src="./assets/images/contoh.png" alt="Ilustrasi artikel tips lolos ATS" class="w-full max-w-md rounded-xl border border-slate-700/60 shadow-lg object-cover">
            
            <div class="flex flex-wrap items-center justify-center gap-4">
                <button type="button" popovertarget="summary-popup" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg shadow-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-400">
                    Lihat Ringkasan
                </button>
                <a href="index.html" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-lg border border-slate-700 transition-colors duration-200">
                    Kembali Ke Halaman Utama
                </a>
            </div>
        </div>

    </main>

    <!-- Script untuk merender hasil analisis AI dari localStorage -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedData = localStorage.getItem('latest_cv_analysis');
            
            if (savedData) {
                try {
                    const analysis = JSON.parse(savedData);
                    
                    // 1. Update Skor & Progress Bar
                    const scoreBar = document.getElementById('score-bar');
                    const scoreText = document.getElementById('score-text');
                    if (scoreBar && scoreText) {
                        const score = analysis.score || 80;
                        scoreBar.style.width = score + '%';
                        scoreText.textContent = score + '%';
                    }

                    // 2. Update Ringkasan AI
                    const summaryEl = document.getElementById('ai-summary');
                    if (summaryEl && analysis.summary) {
                        summaryEl.textContent = analysis.summary;
                    }

                    // 3. Update Saran Perbaikan / Rekomendasi
                    const recContainer = document.getElementById('ai-recommendations');
                    if (recContainer) {
                        const items = analysis.recommendations || analysis.weaknesses || [];
                        if (items.length > 0) {
                            recContainer.innerHTML = items.map(item => `<li class="text-slate-300">${item}</li>`).join('');
                        }
                    }

                    // 4. Update Data Pribadi
                    if (analysis.name) {
                        document.getElementById('cv-name').textContent = analysis.name;
                    }
                    if (analysis.email) {
                        document.getElementById('cv-email').textContent = analysis.email;
                    }
                    if (analysis.experience) {
                        document.getElementById('cv-experience').textContent = analysis.experience;
                    }
                    
                    // Ambil posisi dari input form sebelumnya (jika disimpan di localStorage)
                    const savedPosisi = localStorage.getItem('latest_job_title') || "Web Developer";
                    document.getElementById('cv-position').textContent = analysis.position || savedPosisi;

                    if (analysis.skills && Array.isArray(analysis.skills)) {
                        document.getElementById('cv-skills').textContent = analysis.skills.join(', ');
                    } else if (typeof analysis.skills === 'string') {
                        document.getElementById('cv-skills').textContent = analysis.skills;
                    }

                } catch (e) {
                    console.error("Gagal memparsing data analisis dari localStorage:", e);
                }
            }
        });
    </script>
</body>
</html>

</body>
</html>
